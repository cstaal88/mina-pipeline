# .github/workflows/fetch.yml
# Automated MediaCloud news collection pipeline
#
# Triggered via cron-job.org - runs BOTH topics sequentially
# Each run collects and cleans news for all topics, then uploads to gists

name: "MediaCloud News Pipeline"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to collect (leave empty for ALL topics)'
        required: false
        default: ''

concurrency:
  group: mcloud-fetch
  cancel-in-progress: true

jobs:
  fetch-and-update-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
      GH_TOKEN: ${{ secrets.GIST_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mediacloud python-dotenv
          python3 -m pip install requests beautifulsoup4 lxml tqdm tenacity typer

      - name: Run pipeline for all topics
        run: |
          # Determine which topics to run
          INPUT_TOPIC="${{ github.event.inputs.topic }}"
          
          if [ -n "$INPUT_TOPIC" ]; then
            # Single topic specified
            TOPICS="$INPUT_TOPIC"
          else
            # Run all topics
            TOPICS="minneapolis-ice greenland-trump"
          fi
          
          echo "=== Running pipeline for topics: $TOPICS ==="
          
          for TOPIC in $TOPICS; do
            echo ""
            echo "========================================"
            echo "TOPIC: $TOPIC"
            echo "Started: $(date -u +%Y-%m-%d' '%H:%M' UTC')"
            echo "========================================"
            
            # Use unified gist for all MediaCloud data
            GIST_ID="16c75a94d276d2800a44e3c2437f40e4"
            
            # Download existing mediacloud raw data (the accumulating archive)
            # Each topic has its own raw file to avoid overwriting
            RAW_DIR="mediacloud/raw/${TOPIC}"
            mkdir -p "$RAW_DIR"
            RAW_COMBINED="$RAW_DIR/_combined.jsonl"
            GIST_RAW_FILE="mediacloud_raw_${TOPIC}.jsonl"
            if gh gist view "$GIST_ID" -f "$GIST_RAW_FILE" > "$RAW_COMBINED" 2>/dev/null; then
              EXISTING_RAW=$(wc -l < "$RAW_COMBINED")
              echo "Downloaded $EXISTING_RAW existing MediaCloud raw records for $TOPIC"
            else
              echo "No existing MediaCloud raw data for $TOPIC in unified gist"
              touch "$RAW_COMBINED"  # Create empty file
            fi
            
            # Clean dir starts empty - will be regenerated from raw
            CLEAN_DIR="mediacloud/clean"
            mkdir -p "$CLEAN_DIR"
            rm -f "$CLEAN_DIR/articles-${TOPIC}.jsonl"
            
            # Run pipeline (3-day window handles missed runs and reduces API calls)
            python3 mediacloud/run-pipeline.py --topic "$TOPIC" --auto --days 2 || echo "Pipeline for $TOPIC exited with code $?"
            
            # Upload mediacloud_raw_{topic}.jsonl (the full raw archive for this topic)
            if [ -f "$RAW_COMBINED" ]; then
              echo "Uploading $GIST_RAW_FILE to unified gist..."
              gh gist edit "$GIST_ID" -f "$GIST_RAW_FILE" "$RAW_COMBINED"
            fi
            
            # Upload mediacloud_clean_{topic}.jsonl (regenerated from raw)
            CLEAN_FILE="$CLEAN_DIR/articles-${TOPIC}.jsonl"
            if [ -f "$CLEAN_FILE" ]; then
              echo "Uploading mediacloud_clean_${TOPIC}.jsonl to unified gist..."
              gh gist edit "$GIST_ID" -f "mediacloud_clean_${TOPIC}.jsonl" "$CLEAN_FILE"
              echo "✓ Unified gist updated: https://gist.github.com/$GIST_ID"
            fi
            
            echo "Completed: $TOPIC"
          done
          
          echo ""
          echo "=== All topics completed ==="

      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "MediaCloud Pipeline Completed"
          echo "Date: $(date -u +%Y-%m-%d' '%H:%M' UTC')"
          echo "================================================"
