# .github/workflows/mcloud-pipeline.yml
# Automated MediaCloud news collection pipeline
#
# Runs daily at 6:17 AM UTC (7:17 CET) via GitHub cron
# Also supports manual trigger via workflow_dispatch
# consider cron-job.org in the future ...

name: "MediaCloud News Pipeline"

on:
  schedule:
    # Daily at 6:17 AM UTC (off-peak, after overnight indexing)
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to collect (leave empty for default topic)'
        required: false
        default: ''

concurrency:
  group: mcloud-fetch
  cancel-in-progress: true

jobs:
  fetch-and-update-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
      GH_TOKEN: ${{ secrets.GIST_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mediacloud python-dotenv
          python3 -m pip install requests beautifulsoup4 lxml tqdm tenacity typer

      - name: Run pipeline for all topics
        run: |
          # Determine which topics to run
          INPUT_TOPIC="${{ github.event.inputs.topic }}"
          
          if [ -n "$INPUT_TOPIC" ]; then
            # Single topic specified
            TOPICS="$INPUT_TOPIC"
          else
            # Default: only midterms (minneapolis-ice and greenland-trump dropped)
            TOPICS="midterms"
          fi
          
          echo "=== Running pipeline for topics: $TOPICS ==="
          
          # Use unified gist for all MediaCloud data
          GIST_ID="16c75a94d276d2800a44e3c2437f40e4"
          
          # Download shared mediacloud_raw.jsonl ONCE before processing any topics
          # All topics append to this single file
          SHARED_RAW="mediacloud/raw/_combined.jsonl"
          mkdir -p "mediacloud/raw"
          # A failed download must NOT be treated as "no data yet": that starts
          # from an empty file and the upload below then wipes the archive.
          # Only an absent file is a legitimate fresh start.
          if gh gist view "$GIST_ID" -f "mediacloud_raw.jsonl" > "$SHARED_RAW"; then
            DOWNLOADED_RAW=$(wc -l < "$SHARED_RAW")
            echo "Downloaded $DOWNLOADED_RAW existing MediaCloud raw records"
          elif ! GIST_FILES=$(gh gist view "$GIST_ID" --files 2>&1); then
            echo "ERROR: could not list gist files: $GIST_FILES"
            echo "Refusing to continue - cannot tell if the archive exists."
            exit 1
          elif echo "$GIST_FILES" | grep -qx "mediacloud_raw.jsonl"; then
            echo "ERROR: mediacloud_raw.jsonl is in the gist but could not be downloaded."
            echo "Refusing to continue - uploading now would overwrite the archive."
            exit 1
          else
            echo "No mediacloud_raw.jsonl in gist yet (starting fresh)"
            : > "$SHARED_RAW"
            DOWNLOADED_RAW=0
          fi
          
          for TOPIC in $TOPICS; do
            echo ""
            echo "========================================"
            echo "TOPIC: $TOPIC"
            echo "Started: $(date -u +%Y-%m-%d' '%H:%M' UTC')"
            echo "========================================"
            
            # Each topic has its own raw folder for date-based scraping
            RAW_DIR="mediacloud/raw/${TOPIC}"
            mkdir -p "$RAW_DIR"
            
            # Copy shared raw to topic's _combined.jsonl so combine_raw_files() can merge
            cp "$SHARED_RAW" "$RAW_DIR/_combined.jsonl"
            
            # Clean dir starts empty - will be regenerated from raw
            CLEAN_DIR="mediacloud/clean"
            mkdir -p "$CLEAN_DIR"
            rm -f "$CLEAN_DIR/articles-${TOPIC}.jsonl"
            
            # Run pipeline with --nofilter to just collect raw data (no relevance filtering)
            python3 mediacloud/run-pipeline.py --topic "$TOPIC" --auto --days 2 --nofilter || echo "Pipeline for $TOPIC exited with code $?"
            
            # After pipeline, topic's _combined.jsonl has new records merged
            # Copy back to shared file for next topic
            if [ -f "$RAW_DIR/_combined.jsonl" ]; then
              cp "$RAW_DIR/_combined.jsonl" "$SHARED_RAW"
            fi
            
            echo "Completed: $TOPIC"
          done
          
          # Upload shared mediacloud_raw.jsonl ONCE after all topics
          if [ -f "$SHARED_RAW" ]; then
            FINAL_RAW=$(wc -l < "$SHARED_RAW")
            # Last line of defence: the archive must never shrink.
            if [ "$FINAL_RAW" -lt "$DOWNLOADED_RAW" ]; then
              echo "ERROR: refusing to upload - mediacloud_raw.jsonl would shrink"
              echo "from $DOWNLOADED_RAW to $FINAL_RAW records. Gist left untouched."
              exit 1
            fi
            echo ""
            echo "Uploading mediacloud_raw.jsonl to unified gist ($FINAL_RAW records)..."
            gh gist edit "$GIST_ID" -f "mediacloud_raw.jsonl" "$SHARED_RAW"
            echo "✓ Unified gist updated: https://gist.github.com/$GIST_ID"
          fi
          
          echo ""
          echo "=== All topics completed ==="

      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "MediaCloud Pipeline Completed"
          echo "Date: $(date -u +%Y-%m-%d' '%H:%M' UTC')"
          echo "================================================"

      - name: Check API quota
        if: always()
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python3 mediacloud/quota.py
